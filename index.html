```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Carte menu pensionnaire · Business Hotel Tunis</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bordeaux:#3d0c11;
  --or:#c9a15c;
  --creme:#f7f1e6;
}

*{
  box-sizing:border-box;
  margin:0;
}

html,body{
  height:100%;
}

body{
  font-family:"Cormorant Garamond",Georgia,serif;
  color:var(--creme);
  background:var(--bordeaux) url(hotel.jpg) center/cover no-repeat fixed;
  display:grid;
  place-items:center;
  padding:24px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(247,241,230,.12);
  z-index:0;
}

main{
  position:relative;
  z-index:1;
  width:min(560px,100%);
  text-align:center;
  padding:35px 28px 44px;
  border:1px solid rgba(201,161,92,.65);
  background:rgba(61,12,17,.72);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

/* LOGO */
.logo{
  width:170px;
  max-width:60%;
  height:auto;
  display:block;
  margin:0 auto 22px;
  object-fit:contain;

  background:rgba(247,241,230,.92);
  padding:10px 18px;
  border-radius:4px;
}

/* TITRE */
.hotel{
  font-size:1.05rem;
  letter-spacing:.08em;
  color:var(--or);
}

h1{
  font-size:clamp(2.2rem,8vw,3.1rem);
  font-weight:600;
  line-height:1.1;
  margin:10px 0 6px;
}

.sub{
  font-size:1.2rem;
  opacity:.9;
  margin-bottom:6px;
}

.sub-ar{
  font-family:Amiri,serif;
  font-size:1.25rem;
  opacity:.9;
  margin-bottom:32px;
}

/* BOUTONS */
.choix{
  display:grid;
  gap:14px;
}

a.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-height:64px;
  color:var(--bordeaux);
  background:var(--creme);
  text-decoration:none;
  font-size:1.5rem;
  font-weight:600;
  border:1px solid var(--or);
  transition:background .2s,color .2s;
}

a.btn:hover,
a.btn:focus-visible{
  background:var(--or);
  outline:3px solid var(--creme);
  outline-offset:3px;
}

a.btn.ar{
  font-family:Amiri,serif;
  font-size:1.7rem;
  font-weight:700;
}

.note{
  margin-top:26px;
  font-size:1rem;
  opacity:.8;
}

@media(prefers-reduced-motion:reduce){
  a.btn{
    transition:none;
  }
}

/* MOBILE */
@media(max-width:480px){

  body{
    padding:15px;
  }

  main{
    padding:28px 20px 35px;
  }

  .logo{
    width:145px;
    margin-bottom:18px;
  }

  h1{
    font-size:2.2rem;
  }

  .sub{
    font-size:1.1rem;
  }

  a.btn{
    min-height:58px;
    font-size:1.35rem;
  }

  a.btn.ar{
    font-size:1.55rem;
  }
}
</style>
</head>

<body>

<main>

  <!-- LOGO BUSINESS HOTELS -->
  <img src="logo.png" alt="Business Hotels" class="logo">

  <p class="hotel">Business Hotel Tunis</p>

  <h1>Carte pensionnaire</h1>

  <p class="sub">Choisissez votre langue</p>
p class="sub">Choose your language
</p>
  <p class="sub-ar" lang="ar" dir="rtl">
    اختاروا لغتكم
  </p>

  <div class="choix">

    <!-- FRANÇAIS -->
    <a 
      class="btn" 
      href="carte_pensionnaire_fr.pdf" 
      lang="fr"
    >
      Français
    </a>

    <!-- ANGLAIS -->
    <a 
      class="btn" 
      href="carte_pensionnaire_en.pdf" 
      lang="en"
    >
      English
    </a>

    <!-- ARABE -->
    <a 
      class="btn ar" 
      href="carte_pensionnaire_ar.pdf" 
      lang="ar" 
      dir="rtl"
    >
      العربية
    </a>

  </div>

  <p class="note">
    Bon appétit et excellent séjour
  </p>

</main>

</body>
</html>
